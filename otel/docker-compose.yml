services:
  postgres:
    image: postgres:16-alpine
    container_name: odaradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: odaradar
      POSTGRES_PASSWORD: odaradar
      POSTGRES_DB: odaradar
    ports:
      - "5432:5432"
    volumes:
      - odaradar_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odaradar -d odaradar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  odaradar_postgres:
